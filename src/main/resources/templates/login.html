<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html-head('Login')}"></head>
<body>

    <nav th:replace="~{layout :: navbar}"></nav>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary-subtle text-primary d-inline-flex p-3 rounded-circle mb-3">
                            <i class="fa-solid fa-right-to-bracket fs-2"></i>
                        </div>
                        <h2 class="fw-bold">User Login</h2>
                        <p class="text-muted">Enter your credentials to access your dashboard</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Username or Email -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="username" name="username" class="form-control" placeholder="username or email" required />
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gradient w-100 py-3 rounded-pill fs-5">Login</button>

                        <div class="text-center mt-4">
                            <p class="text-muted">Don't have an account? <a href="/register" class="fw-bold text-primary">Register here</a></p>
                        </div>
                    </form>

                    <div class="border-top pt-3 mt-3 text-center">
                        <small class="text-muted">Demo Admin Credentials: <strong>admin</strong> / <strong>admin123</strong></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
