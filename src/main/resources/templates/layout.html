<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="html-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Smart Queue Management System'">Smart Queue Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --secondary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: var(--primary-gradient);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.35rem;
        }
        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            color: white;
        }
        .btn-gradient-secondary {
            background: var(--secondary-gradient);
            color: white;
            border: none;
            font-weight: 600;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }
        .token-badge {
            font-size: 2rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-banner {
            background: var(--primary-gradient);
            color: white;
            padding: 80px 0;
            border-radius: 0 0 30px 30px;
        }
        footer {
            margin-top: auto;
            background: #0f172a;
            color: #94a3b8;
            padding: 24px 0;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-users-rectangle fs-3"></i>
                <span>Smart Queue</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-medium" href="/"><i class="fa-solid fa-house me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-medium" href="/queue-display" target="_blank"><i class="fa-solid fa-tv me-1"></i> Public Display</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-white fw-medium" href="/dashboard"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-white fw-medium" href="/my-queue"><i class="fa-solid fa-ticket me-1"></i> My Queue</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white fw-medium" href="/admin"><i class="fa-solid fa-user-shield me-1"></i> Admin Panel</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                        <a href="/login" class="btn btn-outline-light rounded-pill px-4 fw-semibold">Login</a>
                        <a href="/register" class="btn btn-light text-primary rounded-pill px-4 fw-semibold">Register</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                        <span class="text-white fw-medium">
                            <i class="fa-solid fa-circle-user me-1"></i>
                            <span sec:authentication="name">User</span>
                        </span>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Alert Messages -->
    <div th:fragment="alerts" class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm border-0" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMessage}">Success message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm border-0" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Footer -->
    <footer th:fragment="footer">
        <div class="container text-center">
            <p class="mb-1 fw-semibold">Smart Queue Management System &copy; 2026</p>
            <small class="text-muted">Designed for College Software Engineering Viva & Project Demonstration</small>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
